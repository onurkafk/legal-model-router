[project]
name = "legal-router"
version = "0.3.0"
description = "Legal Model Router: reads a legal request, picks the model from the Vals Legal Index, calls it through OpenRouter with zero data retention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["legal", "llm", "router", "openrouter", "vals", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.urls]
Homepage = "https://github.com/onurkafk/legal-model-router"
Issues = "https://github.com/onurkafk/legal-model-router/issues"

[project.scripts]
legal-router = "legal_router.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legal_router"]

[tool.hatch.build.targets.sdist]
include = ["legal_router", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
